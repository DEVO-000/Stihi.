<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет соединения — DEVO+</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #090a0f;
            color: #f3f4f6;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Декоративные размытые фоновые сферы */
        .bg-glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(40px);
            z-index: 0;
        }

        .bg-glow-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(50px);
            z-index: 0;
        }

        /* Стеклянный контейнер */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 380px;
            padding: 44px 28px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        /* Иконка с анимацией мягкого покачивания */
        .icon-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 96px;
            height: 96px;
            margin-bottom: 24px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
            animation: float 4s ease-in-out infinite;
        }

        .icon {
            font-size: 42px;
            line-height: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: #9ca3af;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Неоновая кнопка */
        .btn {
            width: 100%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            border-radius: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.01em;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Nunito', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -5px rgba(16, 185, 129, 0.55);
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px -5px rgba(16, 185, 129, 0.4);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }

        .btn:hover svg {
            transform: rotate(180deg);
        }

        /* Футер карточки */
        .badge {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ef4444;
        }

        /* Анимации */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <div class="icon-wrapper">
            <span class="icon">📡</span>
        </div>
        <h1>Нет соединения</h1>
        <p>Проверьте подключение к сети<br>и повторите попытку</p>
        
        <button class="btn" onclick="location.reload()">
            <svg viewBox="0 0 24 24">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Обновить
        </button>

        <div class="badge">
            <span class="badge-dot"></span>
            Стихи DEVO+ • Офлайн-режим
        </div>
    </div>

</body>
</html>
